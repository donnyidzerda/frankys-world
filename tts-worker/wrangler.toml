name = "scribble-tts"
main = "worker.js"
compatibility_date = "2025-01-01"

# Billing. BILLING_PROVIDER picks the Merchant of Record (default "creem").
# CREEM_ENV "test" uses test-api.creem.io + the *_TEST secrets/products; set to
# "live" at go-live. CREEM_PRODUCTS[_TEST] maps our plan keys to Creem product
# ids (fill after creating the products in the Creem dashboard). PADDLE_ENV is
# kept only for the fallback Paddle provider.
[vars]
BILLING_PROVIDER = "creem"
CREEM_ENV = "test"
CREEM_PRODUCTS_TEST = '{"annual":"prod_REPLACE","monthly":"prod_REPLACE","lifetime":"prod_REPLACE"}'
# CREEM_PRODUCTS    = '{"annual":"prod_..","monthly":"prod_..","lifetime":"prod_.."}'
# SUPABASE_URL      = "https://YOURREF.supabase.co"   # set before go-live
PADDLE_ENV = "sandbox"

# Secrets are NOT stored here. Set each once with `npx wrangler secret put`:
#   OPENAI_API_KEY, ELEVENLABS_API_KEY
#   SUPABASE_SERVICE_KEY            (service-role key - webhook writes entitlements)
#   CREEM_API_KEY_TEST, CREEM_WEBHOOK_SECRET_TEST   (+ CREEM_API_KEY / CREEM_WEBHOOK_SECRET at go-live)

# Cross-device sync uses a KV namespace. Create it once with:
#   npx wrangler kv namespace create SCRIBBLE_SYNC
# That command prints an id="..." line; paste the id below, then deploy.
[[kv_namespaces]]
binding = "SYNC"
id = "3b9f3a10b9ef4c5284054795d1199a37"

# Real-time sync: one Durable Object per profile, holding a WebSocket to
# every device. SQLite-backed class so it runs on the free plan too.
[[durable_objects.bindings]]
name = "PROFILE"
class_name = "ProfileRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProfileRoom"]
